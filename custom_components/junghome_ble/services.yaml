assign_key:
  fields:
    key_entity:
      example: "event.living_room_rocker_button_a"
      selector:
        entity:
          integration: junghome_ble
          domain:
            - event
            - binary_sensor
    key_device:
      selector:
        device:
          integration: junghome_ble
          model: "Push-buttons"
    key:
      example: "A"
      selector:
        select:
          options:
            - "A"
            - "B"
            - "C"
            - "D"
            - "E1"
            - "E2"
    target_entity:
      example: "light.living_room_dali"
      selector:
        entity:
          integration: junghome_ble
          domain:
            - light
            - switch
            - cover
            - climate
    target_device:
      selector:
        device:
          integration: junghome_ble
    room:
      example: "Living room"
      selector:
        text:
    room_area:
      selector:
        area:
    scene:
      example: "Evening"
      selector:
        text:
    scene_entity:
      selector:
        entity:
          integration: junghome_ble
          domain: scene
    mode:
      example: "light"
      selector:
        select:
          translation_key: key_mode
          options:
            - light
            - switch
            - move
            - gateway
            - lock
            - light_and_switch
            - temperature
    target_element:
      example: "color_temperature"
      selector:
        select:
          translation_key: target_element
          options:
            - color_temperature
            - slat
    lock_seconds:
      example: 3600
      selector:
        number:
          min: 0
          max: 65535
          mode: box
          unit_of_measurement: s
    force:
      default: false
      selector:
        boolean:
    dry_run:
      default: false
      selector:
        boolean:

