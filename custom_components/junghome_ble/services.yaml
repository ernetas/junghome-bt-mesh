store_scene:
  target:
    entity:
      integration: junghome_ble
      domain:
        - light
        - switch
        - cover
        - climate
  fields:
    scene:
      example: "Movie night"
      selector:
        text:
    scene_entity:
      selector:
        entity:
          integration: junghome_ble
          domain: scene
    state:
      collapsed: true
      fields:
        action:
          example: "on"
          selector:
            select:
              translation_key: schedule_action
              options:
                - "on"
                - "off"
        brightness_pct:
          example: 40
          selector:
            number:
              min: 0
              max: 100
              unit_of_measurement: "%"
        color_temp_kelvin:
          example: 2700
          selector:
            color_temp:
              unit: kelvin
              min: 2000
              max: 10000
        position:
          example: 100
          selector:
            number:
              min: 0
              max: 100
              unit_of_measurement: "%"
        tilt_position:
          example: 50
          selector:
            number:
              min: 0
              max: 100
              unit_of_measurement: "%"
        temperature:
          example: 21
          selector:
            number:
              min: 5
              max: 30
              step: 0.5
              unit_of_measurement: "°C"

