name: Nightly

# How strong the tests are, measured once a day and on demand, never on a push or a pull request (docs/dev/testing.md,
# *Nightly*): the property tests with the `thorough` Hypothesis profile, mutation testing of the modules where a
# wrong line reuses a nonce or accepts a replay, and the integration's tests against the newest Home Assistant test
# stack. None of it gates a merge or a release; a failure here is a finding to look at, and the mutation job reports
# its surviving mutants in the job summary rather than failing on them.
on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

# A run started by hand while the scheduled one still runs waits for it rather than cancelling it.
concurrency:
  group: nightly-${{ github.ref_name }}
  cancel-in-progress: false

# As in ci.yml: nothing here needs more than reading the repository, every job says so, and no checkout keeps the
# token in .git/config. The action SHAs and requirements-test.txt / requirements-mutation.txt are kept current by
# Renovate (renovate.json).
permissions: {}

jobs:
  thorough:
    # Every test file that uses Hypothesis, with the `thorough` profile (tests/jhmesh/hypothesis_profiles.py: many
    # times the examples of a push's run, the reproduction blob printed on a failure). Its example database lives
    # in the Actions cache from one run to the next, so a failing example found once is tried first every night
    # until it is fixed; it is saved whatever the outcome (a failure is exactly what it should remember).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install
        # As ci.yml `tests`: the pinned test stack, plus the `usb` integration's requirements read from the
        # installed Home Assistant's manifest.
        run: |
          pip install -r requirements-test.txt
          # shellcheck disable=SC2046  # the word splitting is the point: one requirement per word
          pip install $(python -c '
          import json, pathlib, homeassistant
          manifest = pathlib.Path(homeassistant.__file__).parent / "components" / "usb" / "manifest.json"
          print(" ".join(json.loads(manifest.read_text())["requirements"]))
          ')
      - name: Restore the example database
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hypothesis
          key: hypothesis-${{ github.run_id }}
          restore-keys: hypothesis-
      - name: Property tests, thorough profile
        # The files are found rather than listed, so a new property test is included by itself. No per-test
        # timeout of pyproject.toml's size (a state machine's 2000 examples take minutes): the job's own bounds it.
        env:
          HYPOTHESIS_PROFILE: thorough
        run: |
          mapfile -t files < <(grep -rlE '^(from|import) hypothesis' tests --include='test_*.py' | sort)
          python -m pytest "${files[@]}" -q -n auto -p no:cacheprovider --timeout=1800 --durations=20
      - name: Save the example database
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hypothesis
          key: hypothesis-${{ github.run_id }}

  mutation:
    # mutmut (requirements-mutation.txt) over jhmesh's crypto.py, pdu.py, client.py and state.py (SAR, the replay
    # list, the IV index, the sequence numbers) and the integration's seq_store.py, each mutant run against the
    # tests that reach the function it changes (pyproject.toml `[tool.mutmut]`). Review 3 found a nonce-reuse
    # mutant that passed the whole suite; this is where the next one shows up. Survivors are listed in the job
    # summary (counts per module, then each surviving mutant's diff); they do not fail the job.
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            requirements-mutation.txt
      - name: Install
        run: |
          pip install -r requirements-test.txt -r requirements-mutation.txt
          # shellcheck disable=SC2046  # the word splitting is the point: one requirement per word
          pip install $(python -c '
          import json, pathlib, homeassistant
          manifest = pathlib.Path(homeassistant.__file__).parent / "components" / "usb" / "manifest.json"
          print(" ".join(json.loads(manifest.read_text())["requirements"]))
          ')
      - name: Mutate
        run: python -m mutmut run --max-children "$(nproc)"
      - name: Surviving mutants
        if: always()
        run: |
          python -m mutmut export-cicd-stats
          python - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import collections, json, pathlib, subprocess, sys

          stats = json.loads(pathlib.Path("mutants/mutmut-cicd-stats.json").read_text())
          results = subprocess.run(
              [sys.executable, "-m", "mutmut", "results"], capture_output=True, text=True, check=True
          ).stdout
          survivors = [
              line.split(":")[0].strip() for line in results.splitlines() if line.strip().endswith(": survived")
          ]
          print("## Mutation testing\n")
          print("| killed | survived | timeout | no tests | suspicious | total |")
          print("|---|---|---|---|---|---|")
          print(
              f"| {stats['killed']} | {stats['survived']} | {stats['timeout']} | {stats['no_tests']} "
              f"| {stats['suspicious']} | {stats['total']} |\n"
          )
          by_module = collections.Counter(name.split(".x")[0] for name in survivors)
          for module, count in sorted(by_module.items()):
              print(f"- `{module}`: {count} surviving")
          shown = survivors[:60]
          if shown:
              print(f"\n<details><summary>The first {len(shown)} surviving mutants</summary>\n")
              for name in shown:
                  diff = subprocess.run(
                      [sys.executable, "-m", "mutmut", "show", name], capture_output=True, text=True
                  ).stdout
                  print(f"`{name}`\n\n```diff\n{diff.strip()}\n```\n")
              print("</details>")
          PY

  newest-home-assistant:
    # The whole suite against the newest pytest-homeassistant-custom-component (and the Home Assistant it pins)
    # rather than the release requirements-test.txt pins: an early warning of what the next Renovate PR will
    # break. Non-blocking: the run stays green when it fails, the job shows the failure. No coverage gate.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # no pip cache: what is installed here is whatever is newest, not a pinned set worth keeping
          python-version: "3.14"
      - name: Install the newest test stack
        run: |
          pip install pytest-homeassistant-custom-component "$(grep -E '^hypothesis==' requirements-test.txt)"
          # shellcheck disable=SC2046  # the word splitting is the point: one requirement per word
          pip install $(python -c '
          import json, pathlib, homeassistant
          manifest = pathlib.Path(homeassistant.__file__).parent / "components" / "usb" / "manifest.json"
          print(" ".join(json.loads(manifest.read_text())["requirements"]))
          ')
      - name: State the stack installed, against the newest on PyPI
        # pip installs the newest release this job's Python can run: one that needs a newer Python leaves an older
        # stack here, and the job would stay green on it. The summary says which; a mismatch is annotated.
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from importlib.metadata import version
          from homeassistant.const import __version__ as home_assistant
          name = "pytest-homeassistant-custom-component"
          installed = version(name)
          with urllib.request.urlopen(f"https://pypi.org/pypi/{name}/json", timeout=30) as answer:
              newest = json.load(answer)["info"]["version"]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"Home Assistant {home_assistant} ({name} {installed}; newest on PyPI {newest})\n")
          if installed != newest:
              print(f"::warning::{name} {installed} installed, not the newest {newest}: it needs another Python?")
          PY
      - name: Tests
        run: python -m pytest tests -q -n auto -p no:cacheprovider --durations=20
